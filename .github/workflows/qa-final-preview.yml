name: Final card layout validation
on:
  push:
    branches: [feature/phone-pc-preview]
    paths: [.github/workflows/qa-final-preview.yml]
permissions:
  contents: write
jobs:
  validate:
    if: github.ref == 'refs/heads/feature/phone-pc-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct the canonical main artwork, not individual display sizes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 1b5c9281c10c20cdf2363cd84e7c2da1af5a9263
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('packs/durak/styles.css')
          raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='f633e997558b235277589f64b652da72d0c3f30506d1c6f885c5634e5322ce54'
          s=raw.decode('utf-8')
          a='position:absolute!important;display:block!important;top:5px!important;left:4px!important;right:auto!important;bottom:auto!important;font:850 18px/1 system-ui,sans-serif!important;letter-spacing:0!important'
          b='position:absolute!important;display:flex!important;align-items:center;gap:1px;top:5px!important;left:4px!important;right:auto!important;bottom:auto!important;font:850 16px/1 system-ui,sans-serif!important;letter-spacing:0!important'
          assert s.count(a)==1;s=s.replace(a,b)
          a='display:block!important;font:850 15px/1 system-ui,sans-serif!important;margin:0!important'
          b='display:inline!important;font:850 12px/1 system-ui,sans-serif!important;margin:0!important'
          assert s.count(a)==1;s=s.replace(a,b)
          raw=s.encode('utf-8')
          assert hashlib.sha256(raw).hexdigest()=='576d12ca07d4dd742d7ced5c71b4cca82d8e93ad2bed8c04c536e2198bb4908d'
          p.write_bytes(raw)
          PY
          git diff --check
          bash scripts/codex/check.sh
          git add packs/durak/styles.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "fix: keep canonical Durak corners visible in both horizontal and vertical overlaps"
          git push origin HEAD:feature/phone-pc-preview
      - uses: actions/upload-artifact@v4
        with:
          name: preview-packs-final
          path: dist/
          retention-days: 14
