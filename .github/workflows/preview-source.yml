name: Apply tested preview implementation
on:
  push:
    branches: [feature/authority-responsive-preview]
    paths: [.github/workflows/preview-source.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply checksum-verified patch to unchanged task base
        env:
          PATCH_B64: 
        run: |
          git diff --exit-code cad3c3d3a2885e65b790b4b64f8cccc82fb0c16a HEAD -- . ':(exclude).github/workflows/*'
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib
          data = base64.b64decode(os.environ['PATCH_B64'], validate=True)
          assert hashlib.sha256(data).hexdigest() == '118d4130b78f61f6306938e6517957f275a00b2b59f4b5321fb889c52e04385d'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'implementation.patch').write_bytes(lzma.decompress(data))
          PY
          git apply --index --unidiff-zero "$RUNNER_TEMP/implementation.patch"
          git diff --cached --check
      - name: Validate the actual changed pack sources
        run: bash scripts/codex/check.sh
      - name: Commit only validated implementation to the task branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add UNO personal surfaces and proportional compact card artwork'
          git push origin HEAD:feature/authority-responsive-preview
