name: Validate preview packs
on:
  push:
    branches: [feature/phone-pc-preview]
    paths: [.github/workflows/preview-source.yml]
permissions:
  contents: write
jobs:
  validate:
    if: github.ref == 'refs/heads/feature/phone-pc-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified version and documentation edits
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,pathlib,subprocess
          payload=''
          changes=json.loads(gzip.decompress(base64.b64decode(payload)))
          for change in changes:
              path=pathlib.Path(change['path'])
              assert str(path) in ('README.md','examples/private-counter/README.md','packs/durak/rules.js','packs/uno/rules.js')
              raw=path.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==change['before'],path
              text=raw.decode('utf-8')
              for start,end,replacement in reversed(change['edits']):
                  text=text[:start]+replacement+text[end:]
              raw=text.encode('utf-8')
              assert hashlib.sha256(raw).hexdigest()==change['after'],path
              path.write_bytes(raw)
          subprocess.run(['git','add','--',*[e['path'] for e in changes]],check=True)
          PY
          git diff --cached --check
          bash scripts/codex/check.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "fix: pin preview rule versions and correct device test commands"
          git push origin HEAD:feature/phone-pc-preview
      - uses: actions/upload-artifact@v4
        with:
          name: preview-packs
          path: dist/
          retention-days: 14
