name: System-font corner validation
on:
  push:
    branches: [feature/phone-pc-preview]
    paths: [.github/workflows/qa-font-corners.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply cross-font verified canonical artwork
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('packs/durak/styles.css');raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='ac3103822c54caa669fce24a715b23f1ebd9987924106d0f69dccdaae086a332'
          s=raw.decode('utf-8')
          a='gap:1px;top:5px!important;left:2px!important;right:auto!important;bottom:auto!important;font:850 14px/1'
          b='gap:0;top:5px!important;left:2px!important;right:auto!important;bottom:auto!important;font:850 13px/1'
          assert s.count(a)==1;s=s.replace(a,b)
          a='display:inline!important;font:850 12px/1 system-ui,sans-serif!important;margin:0!important'
          b='display:inline!important;font:850 10px/1 system-ui,sans-serif!important;margin:0!important'
          assert s.count(a)==1;s=s.replace(a,b);raw=s.encode('utf-8')
          assert hashlib.sha256(raw).hexdigest()=='571421901e059800c399fc2489035b0a45481052a41eb2b9a101fa7e05b88d01'
          p.write_bytes(raw)
          PY
          git diff --check
          bash scripts/codex/check.sh
          git add packs/durak/styles.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "fix: preserve two-digit corner readability with wider system fonts"
          git push origin HEAD:feature/phone-pc-preview
      - uses: actions/upload-artifact@v4
        with:
          name: preview-packs-cross-font
          path: dist/
          retention-days: 14
