name: Pack checks
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the same tools as Codex Cloud
        run: bash scripts/codex/setup.sh
      - name: Check the independent packs
        run: bash scripts/codex/check.sh
