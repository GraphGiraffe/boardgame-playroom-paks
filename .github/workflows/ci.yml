name: Pack checks
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check game scripts
        run: find packs -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: python3 build.py
      - name: Verify distribution checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS
