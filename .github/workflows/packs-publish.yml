name: Publish independent game packs
on:
  workflow_dispatch:
    inputs:
      checks:
        description: 'Publication verifies immutable release files; explicitly select none'
        type: string
        required: true
      channel:
        description: Isolated catalog channel; empty selects production
        type: string
      release:
        description: Published pack collection release tag, for example v0.6.0
        type: string
      only:
        description: Optional one pack ID; empty publishes the whole collection
        type: string
      bootstrap:
        description: Initial catalog publication only
        type: boolean
        default: false
      rollback:
        description: Prior catalog snapshot SHA256; set instead of release to roll back
        type: string
      probe:
        description: Verify R2 bucket access without publishing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: protected-pack-catalog-${{ inputs.channel || 'production' }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PLAYROOM_PACKS_BUCKET: ${{ vars.PLAYROOM_PACKS_BUCKET }}
      RELEASE: ${{ inputs.release }}
      ONLY: ${{ inputs.only }}
      BOOTSTRAP: ${{ inputs.bootstrap }}
      ROLLBACK: ${{ inputs.rollback }}
      PROBE: ${{ inputs.probe }}
      CHANNEL: ${{ inputs.channel }}
      CHECKS: ${{ inputs.checks }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned shared project tools
        uses: actions/checkout@v4
        with:
          repository: GraphGiraffe/boardgame-playroom-utils
          ref: 3ec4e4a1df3c5a0a6c9921b27a0da44990eef56f
          ssh-key: ${{ secrets.PLAYROOM_UTILS_READ_KEY }}
          path: .playroom-utils
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify input and release assets
        shell: bash
        run: |
          test "$CHECKS" = none || { echo "Select checks=none for immutable artifact publication" >&2; exit 2; }
          set -euo pipefail
          test -n "$PLAYROOM_PACKS_BUCKET"
          if test "$PROBE" = true; then
            test -z "$RELEASE" && test -z "$ONLY" && test -z "$ROLLBACK"
            npx --yes wrangler@4.149.0 r2 bucket info "$PLAYROOM_PACKS_BUCKET"
            exit 0
          fi
          if test -n "$ROLLBACK"; then
            test -z "$RELEASE" && test -z "$ONLY"
            python3 scripts/publish-packs.py --bucket "$PLAYROOM_PACKS_BUCKET" --rollback "$ROLLBACK" --channel "$CHANNEL"
            exit 0
          fi
          [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          if [[ "$RELEASE" == *-* ]]; then test -n "$CHANNEL"; fi
          mkdir -p dist/packs-release
          gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft --jq 'select(.tagName=="'"$RELEASE"'" and .isDraft==false) | .tagName' | grep -Fx "$RELEASE"
          gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --pattern '*.playroom-pack.json' --pattern SHA256SUMS --dir dist/packs-release
          if gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx SOURCE-PROVENANCE.json; then
            gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --pattern SOURCE-PROVENANCE.json --dir dist/packs-release
          fi
          args=(--channel "$CHANNEL" --bucket "$PLAYROOM_PACKS_BUCKET" --assets dist/packs-release --collection "${RELEASE#v}")
          if test -n "$ONLY"; then args+=(--only "$ONLY"); fi
          if test "$BOOTSTRAP" = true; then args+=(--bootstrap); fi
          python3 scripts/publish-packs.py "${args[@]}" --dry-run
          python3 scripts/publish-packs.py "${args[@]}"
